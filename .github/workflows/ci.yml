# SPDX-License-Identifier: GPL-3.0-or-later
#
# Builds and tests on Linux, Windows and macOS. Original Anno 1602 data never reaches CI; the tests
# that need it skip themselves. The private analysis repository (open1602-re) is not needed here.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Actions are pinned to commit SHAs (the tag in the comment); Dependabot proposes updates
# (.github/dependabot.yml).
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # cc compiles ENet (C), cxx the rest: both from the same compiler, so that a sanitizer job
        # links one runtime.
        include:
          - { name: Linux GCC,     os: ubuntu-24.04, cc: gcc,   cxx: g++,     preset: ci }
          - { name: Linux Clang,   os: ubuntu-24.04, cc: clang, cxx: clang++, preset: ci }
          - { name: Linux ASan,    os: ubuntu-24.04, cc: clang, cxx: clang++, preset: asan }
          - { name: Linux TSan,    os: ubuntu-24.04, cc: clang, cxx: clang++, preset: tsan }
          - { name: Windows MSVC,  os: windows-2025, cc: cl,    cxx: cl,      preset: ci }
          # Debug off Linux: asserts and the debug checks of MSVC's STL run there too.
          - { name: Windows Debug, os: windows-2025, cc: cl,    cxx: cl,      preset: debug }
          - { name: macOS Clang,   os: macos-15,     cc: clang, cxx: clang++, preset: ci }
          - { name: macOS Debug,   os: macos-15,     cc: clang, cxx: clang++, preset: debug }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build zlib1g-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Set up MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756  # v1.13.0
        with:
          arch: x64

      - name: Cache zlib (Windows)
        if: runner.os == 'Windows'
        id: zlib-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ runner.temp }}/zlib
          key: zlib-1.3.1-${{ matrix.os }}

      - name: Build zlib (Windows)
        if: runner.os == 'Windows' && steps.zlib-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          git clone --depth 1 --branch v1.3.1 https://github.com/madler/zlib zlib-src
          cmake -S zlib-src -B zlib-build -G Ninja -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX="${{ runner.temp }}/zlib"
          cmake --build zlib-build
          cmake --install zlib-build

      - name: Configure
        shell: bash
        run: >
          cmake --preset ${{ matrix.preset }} -DCMAKE_C_COMPILER=${{ matrix.cc }} -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          -DCMAKE_PREFIX_PATH="${{ runner.temp }}/zlib" ${{ runner.os == 'Windows' && '-DZLIB_USE_STATIC_LIBS=ON' || '' }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} -- -k 0  # report every failing file at once

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  game:
    name: Game (SDL3, ${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux,      os: ubuntu-24.04, preset: ci }
          - { name: Linux ASan, os: ubuntu-24.04, preset: asan }  # the game's start under ASan/UBSan
          - { name: Windows,    os: windows-2025, preset: ci }
          - { name: macOS,      os: macos-15,     preset: ci }
    env:
      SDL_VERSION: 3.2.24
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: >
          sudo apt-get update && sudo apt-get install -y ninja-build zlib1g-dev libx11-dev libxext-dev
          libxrandr-dev libxcursor-dev libxi-dev libxss-dev libwayland-dev libxkbcommon-dev wayland-protocols
          libegl1-mesa-dev libgl1-mesa-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Set up MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756  # v1.13.0
        with:
          arch: x64

      - name: Cache SDL3
        id: sdl-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ runner.temp }}/sdl3
          key: sdl3-${{ env.SDL_VERSION }}-${{ matrix.os }}

      - name: Build SDL3
        if: steps.sdl-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          git clone --depth 1 --branch "release-$SDL_VERSION" https://github.com/libsdl-org/SDL sdl-src
          cmake -S sdl-src -B sdl-build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF \
                -DCMAKE_INSTALL_PREFIX="${{ runner.temp }}/sdl3"
          cmake --build sdl-build
          cmake --install sdl-build

      - name: Cache zlib (Windows)
        if: runner.os == 'Windows'
        id: zlib-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ runner.temp }}/zlib
          key: zlib-1.3.1-${{ matrix.os }}

      - name: Build zlib (Windows)
        if: runner.os == 'Windows' && steps.zlib-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          git clone --depth 1 --branch v1.3.1 https://github.com/madler/zlib zlib-src
          cmake -S zlib-src -B zlib-build -G Ninja -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX="${{ runner.temp }}/zlib"
          cmake --build zlib-build
          cmake --install zlib-build

      - name: Configure
        shell: bash
        run: >
          cmake --preset ${{ matrix.preset }} -DO1602_BUILD_GAME=ON
          -DCMAKE_PREFIX_PATH="${{ runner.temp }}/sdl3;${{ runner.temp }}/zlib"
          ${{ runner.os == 'Windows' && '-DZLIB_USE_STATIC_LIBS=ON' || '' }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} -- -k 0

      # The other tests run in the build job; here the SDL layer's, on SDL's dummy drivers.
      - name: Test the SDL layer
        run: ctest --preset ${{ matrix.preset }} -R "^sdl$"

      - name: Check the app bundle (macOS)
        if: runner.os == 'macOS'
        run: |
          app=build/${{ matrix.preset }}/bin/Open1602.app/Contents
          plutil -lint "$app/Info.plist"
          test "$(plutil -extract CFBundleIconFile raw "$app/Info.plist")" = open1602.icns
          test -f "$app/Resources/open1602.icns"

      - name: Start the game without data
        shell: bash
        timeout-minutes: 5
        run: >
          .github/workflows/start-game.sh build/${{ matrix.preset }}/bin/${{ runner.os == 'macOS' && 'Open1602.app/Contents/MacOS/Open1602' || 'open1602' }}

  vcpkg:
    name: Game (vcpkg preset, Windows)
    runs-on: windows-2025
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756  # v1.13.0
        with:
          arch: x64

      - name: Set up vcpkg at the manifest's baseline
        shell: bash
        run: |
          root="$VCPKG_INSTALLATION_ROOT"
          baseline=$(jq -r '."builtin-baseline"' vcpkg.json)
          git -C "$root" cat-file -e "$baseline^{commit}" 2>/dev/null || git -C "$root" fetch --quiet origin
          echo "VCPKG_ROOT=$root" >> "$GITHUB_ENV"
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"

      - name: Cache vcpkg packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ github.workspace }}/vcpkg-cache
          key: vcpkg-${{ hashFiles('vcpkg.json') }}-windows-2025

      - name: Configure
        run: cmake --preset vcpkg

      - name: Build
        run: cmake --build --preset vcpkg

      - name: Test
        run: ctest --preset vcpkg

      - name: Start the game without data
        shell: bash
        timeout-minutes: 5
        run: .github/workflows/start-game.sh bin/open1602  # the vcpkg preset builds into bin/

  coverage:
    name: Coverage (Linux GCC)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install dependencies
        # gcovr from PyPI at a fixed version: the report looks the same on every runner image.
        run: |
          sudo apt-get update && sudo apt-get install -y ninja-build zlib1g-dev
          pipx install gcovr==8.3

      - name: Configure
        run: cmake --preset coverage -DCMAKE_CXX_COMPILER=g++

      - name: Build
        run: cmake --build --preset coverage -- -k 0

      - name: Run the tests that need no original data
        run: build/coverage/tests/o1602_tests --no-data

      - name: Report
        # Lines and branches of the engine's sources (not tests, tools or third_party); the summary
        # goes to the job's page, the HTML report into the artifact.
        run: |
          set -o pipefail
          mkdir -p coverage
          gcovr --root . --object-directory build/coverage --filter 'engine/' \
                --exclude-throw-branches --exclude-unreachable-branches \
                --txt coverage/summary.txt --json-summary-pretty --json-summary coverage/summary.json \
                --html-details coverage/index.html --print-summary | tee coverage/totals.txt
          {
            echo '### Coverage of `o1602_tests --no-data` (engine/)'
            echo '```'
            cat coverage/totals.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: coverage
          path: coverage/
          if-no-files-found: error

      - name: Coverage floor
        # A change may not lower the coverage much (BT-1): the floor is a little below what the
        # tests reach (lines 79.6 %, functions 90.3 % with the tests of every selection window,
        # #187-#190). Raise it as tests are added.
        run: |
          python3 -I - <<'EOF'
          import json
          floor = {"line_percent": 79.0, "function_percent": 89.5}
          summary = json.load(open("coverage/summary.json"))
          low = [f"{k}: {summary[k]:.1f} % < {v} %" for k, v in floor.items() if summary[k] < v]
          for line in low:
              print(f"::error::coverage below its floor, {line}")
          raise SystemExit(1 if low else 0)
          EOF

  tidy:
    name: clang-tidy
    runs-on: ubuntu-24.04
    env:
      SDL_VERSION: 3.2.24
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install dependencies
        run: >
          sudo apt-get update && sudo apt-get install -y clang-18 clang-tidy-18 ninja-build zlib1g-dev
          libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev libwayland-dev
          libxkbcommon-dev wayland-protocols libegl1-mesa-dev libgl1-mesa-dev

      # The same SDL3 as the game job's Linux build (same cache key).
      - name: Cache SDL3
        id: sdl-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ runner.temp }}/sdl3
          key: sdl3-${{ env.SDL_VERSION }}-ubuntu-24.04

      - name: Build SDL3
        if: steps.sdl-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "release-$SDL_VERSION" https://github.com/libsdl-org/SDL sdl-src
          cmake -S sdl-src -B sdl-build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF \
                -DCMAKE_INSTALL_PREFIX="${{ runner.temp }}/sdl3"
          cmake --build sdl-build
          cmake --install sdl-build

      # Only the compile commands: clang-tidy parses the sources itself (checks in .clang-tidy).
      - name: Configure
        run: >
          cmake --preset ci -DO1602_BUILD_GAME=ON -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          -DCMAKE_C_COMPILER=clang-18 -DCMAKE_CXX_COMPILER=clang++-18
          -DCMAKE_PREFIX_PATH="${{ runner.temp }}/sdl3"

      - name: clang-tidy (engine)
        run: |
          clang-tidy-18 --version
          run-clang-tidy-18 -quiet -j "$(nproc)" -clang-tidy-binary clang-tidy-18 -p build/ci "$PWD/engine/"

  checks:
    name: Formatting
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install clang-format 18
        run: sudo apt-get update && sudo apt-get install -y clang-format-18
      - name: Check formatting
        # Called by its versioned name so that a runner image with another default version cannot
        # reformat the code (CONTRIBUTING.md names version 18).
        run: |
          clang-format-18 --version
          find engine tools tests \( -name '*.cpp' -o -name '*.hpp' \) -print0 | xargs -0 clang-format-18 --dry-run --Werror
      - name: Check the Python scripts compile
        # Syntax only: the tools run on the developer's machine, with the original data (BT-22).
        run: git ls-files -z '*.py' | xargs -0 python3 -c 'import sys; [compile(open(f, encoding="utf-8").read(), f, "exec") for f in sys.argv[1:]]'
