# SPDX-License-Identifier: GPL-3.0-or-later
#
# Builds and tests on Linux, Windows and macOS. Original Anno 1602 data never reaches CI; the tests
# that need it skip themselves. The private analysis repository (open1602-re) is not needed here.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux GCC,    os: ubuntu-24.04, cxx: g++,     preset: ci }
          - { name: Linux Clang,  os: ubuntu-24.04, cxx: clang++, preset: ci }
          - { name: Linux ASan,   os: ubuntu-24.04, cxx: clang++, preset: asan }
          - { name: Windows MSVC, os: windows-2022, cxx: cl,      preset: ci }
          - { name: macOS Clang,  os: macos-14,     cxx: clang++, preset: ci }
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build zlib1g-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Set up MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Cache zlib (Windows)
        if: runner.os == 'Windows'
        id: zlib-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/zlib
          key: zlib-1.3.1-${{ matrix.os }}

      - name: Build zlib (Windows)
        if: runner.os == 'Windows' && steps.zlib-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          git clone --depth 1 --branch v1.3.1 https://github.com/madler/zlib zlib-src
          cmake -S zlib-src -B zlib-build -G Ninja -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX="${{ runner.temp }}/zlib"
          cmake --build zlib-build
          cmake --install zlib-build

      - name: Configure
        shell: bash
        run: >
          cmake --preset ${{ matrix.preset }} -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          -DCMAKE_PREFIX_PATH="${{ runner.temp }}/zlib" -DZLIB_USE_STATIC_LIBS=ON

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} -- -k 0  # report every failing file at once

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  game:
    name: Game (SDL3, ${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux,   os: ubuntu-24.04 }
          - { name: Windows, os: windows-2022 }
          - { name: macOS,   os: macos-14 }
    env:
      SDL_VERSION: 3.2.24
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: >
          sudo apt-get update && sudo apt-get install -y ninja-build zlib1g-dev libx11-dev libxext-dev
          libxrandr-dev libxcursor-dev libxi-dev libxss-dev libwayland-dev libxkbcommon-dev wayland-protocols
          libegl1-mesa-dev libgl1-mesa-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Set up MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Cache SDL3
        id: sdl-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/sdl3
          key: sdl3-${{ env.SDL_VERSION }}-${{ matrix.os }}

      - name: Build SDL3
        if: steps.sdl-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          git clone --depth 1 --branch "release-$SDL_VERSION" https://github.com/libsdl-org/SDL sdl-src
          cmake -S sdl-src -B sdl-build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF \
                -DCMAKE_INSTALL_PREFIX="${{ runner.temp }}/sdl3"
          cmake --build sdl-build
          cmake --install sdl-build

      - name: Cache zlib (Windows)
        if: runner.os == 'Windows'
        id: zlib-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/zlib
          key: zlib-1.3.1-${{ matrix.os }}

      - name: Build zlib (Windows)
        if: runner.os == 'Windows' && steps.zlib-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          git clone --depth 1 --branch v1.3.1 https://github.com/madler/zlib zlib-src
          cmake -S zlib-src -B zlib-build -G Ninja -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX="${{ runner.temp }}/zlib"
          cmake --build zlib-build
          cmake --install zlib-build

      - name: Configure
        shell: bash
        run: >
          cmake --preset ci -DO1602_BUILD_GAME=ON -DCMAKE_PREFIX_PATH="${{ runner.temp }}/sdl3;${{ runner.temp }}/zlib"
          -DZLIB_USE_STATIC_LIBS=ON

      - name: Build
        run: cmake --build --preset ci -- -k 0

      - name: Start the game once
        shell: bash
        run: .github/workflows/start-game.sh build/ci/engine/app/open1602

  vcpkg:
    name: Game (vcpkg preset, Windows)
    runs-on: windows-2022
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-cache
    steps:
      - uses: actions/checkout@v5

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up vcpkg at the manifest's baseline
        shell: bash
        run: |
          root="$VCPKG_INSTALLATION_ROOT"
          baseline=$(jq -r '."builtin-baseline"' vcpkg.json)
          git -C "$root" cat-file -e "$baseline^{commit}" 2>/dev/null || git -C "$root" fetch --quiet origin
          echo "VCPKG_ROOT=$root" >> "$GITHUB_ENV"
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/vcpkg-cache
          key: vcpkg-${{ hashFiles('vcpkg.json') }}-windows-2022

      - name: Configure
        run: cmake --preset vcpkg

      - name: Build
        run: cmake --build --preset vcpkg

      - name: Test
        run: ctest --preset vcpkg

      - name: Start the game once
        shell: bash
        run: .github/workflows/start-game.sh build/vcpkg/engine/app/open1602

  checks:
    name: Formatting
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Check formatting
        run: |
          clang-format --version
          find engine tools tests \( -name '*.cpp' -o -name '*.hpp' \) -print0 | xargs -0 clang-format --dry-run --Werror
