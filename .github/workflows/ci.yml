# SPDX-License-Identifier: GPL-3.0-or-later
#
# Builds and tests on Linux, Windows and macOS. Original Anno 1602 data never reaches CI; the tests
# that need it skip themselves. The private analysis repository (open1602-re) is not needed here.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Actions are pinned to commit SHAs (the tag in the comment); Dependabot proposes updates
# (.github/dependabot.yml).
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux GCC,    os: ubuntu-24.04, cxx: g++,     preset: ci }
          - { name: Linux Clang,  os: ubuntu-24.04, cxx: clang++, preset: ci }
          - { name: Linux ASan,   os: ubuntu-24.04, cxx: clang++, preset: asan }
          - { name: Windows MSVC, os: windows-2022, cxx: cl,      preset: ci }
          - { name: macOS Clang,  os: macos-14,     cxx: clang++, preset: ci }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build zlib1g-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Set up MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756  # v1.13.0
        with:
          arch: x64

      - name: Cache zlib (Windows)
        if: runner.os == 'Windows'
        id: zlib-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ runner.temp }}/zlib
          key: zlib-1.3.1-${{ matrix.os }}

      - name: Build zlib (Windows)
        if: runner.os == 'Windows' && steps.zlib-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          git clone --depth 1 --branch v1.3.1 https://github.com/madler/zlib zlib-src
          cmake -S zlib-src -B zlib-build -G Ninja -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX="${{ runner.temp }}/zlib"
          cmake --build zlib-build
          cmake --install zlib-build

      - name: Configure
        shell: bash
        run: >
          cmake --preset ${{ matrix.preset }} -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          -DCMAKE_PREFIX_PATH="${{ runner.temp }}/zlib" ${{ runner.os == 'Windows' && '-DZLIB_USE_STATIC_LIBS=ON' || '' }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} -- -k 0  # report every failing file at once

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  game:
    name: Game (SDL3, ${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux,      os: ubuntu-24.04, preset: ci }
          - { name: Linux ASan, os: ubuntu-24.04, preset: asan }  # the game's start under ASan/UBSan
          - { name: Windows,    os: windows-2022, preset: ci }
          - { name: macOS,      os: macos-14,     preset: ci }
    env:
      SDL_VERSION: 3.2.24
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: >
          sudo apt-get update && sudo apt-get install -y ninja-build zlib1g-dev libx11-dev libxext-dev
          libxrandr-dev libxcursor-dev libxi-dev libxss-dev libwayland-dev libxkbcommon-dev wayland-protocols
          libegl1-mesa-dev libgl1-mesa-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Set up MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756  # v1.13.0
        with:
          arch: x64

      - name: Cache SDL3
        id: sdl-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ runner.temp }}/sdl3
          key: sdl3-${{ env.SDL_VERSION }}-${{ matrix.os }}

      - name: Build SDL3
        if: steps.sdl-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          git clone --depth 1 --branch "release-$SDL_VERSION" https://github.com/libsdl-org/SDL sdl-src
          cmake -S sdl-src -B sdl-build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF \
                -DCMAKE_INSTALL_PREFIX="${{ runner.temp }}/sdl3"
          cmake --build sdl-build
          cmake --install sdl-build

      - name: Cache zlib (Windows)
        if: runner.os == 'Windows'
        id: zlib-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ runner.temp }}/zlib
          key: zlib-1.3.1-${{ matrix.os }}

      - name: Build zlib (Windows)
        if: runner.os == 'Windows' && steps.zlib-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          git clone --depth 1 --branch v1.3.1 https://github.com/madler/zlib zlib-src
          cmake -S zlib-src -B zlib-build -G Ninja -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX="${{ runner.temp }}/zlib"
          cmake --build zlib-build
          cmake --install zlib-build

      - name: Configure
        shell: bash
        run: >
          cmake --preset ${{ matrix.preset }} -DO1602_BUILD_GAME=ON
          -DCMAKE_PREFIX_PATH="${{ runner.temp }}/sdl3;${{ runner.temp }}/zlib"
          ${{ runner.os == 'Windows' && '-DZLIB_USE_STATIC_LIBS=ON' || '' }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} -- -k 0

      - name: Start the game without data
        shell: bash
        timeout-minutes: 5
        run: .github/workflows/start-game.sh build/${{ matrix.preset }}/engine/app/open1602

  vcpkg:
    name: Game (vcpkg preset, Windows)
    runs-on: windows-2022
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756  # v1.13.0
        with:
          arch: x64

      - name: Set up vcpkg at the manifest's baseline
        shell: bash
        run: |
          root="$VCPKG_INSTALLATION_ROOT"
          baseline=$(jq -r '."builtin-baseline"' vcpkg.json)
          git -C "$root" cat-file -e "$baseline^{commit}" 2>/dev/null || git -C "$root" fetch --quiet origin
          echo "VCPKG_ROOT=$root" >> "$GITHUB_ENV"
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"

      - name: Cache vcpkg packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ github.workspace }}/vcpkg-cache
          key: vcpkg-${{ hashFiles('vcpkg.json') }}-windows-2022

      - name: Configure
        run: cmake --preset vcpkg

      - name: Build
        run: cmake --build --preset vcpkg

      - name: Test
        run: ctest --preset vcpkg

      - name: Start the game without data
        shell: bash
        timeout-minutes: 5
        run: .github/workflows/start-game.sh build/vcpkg/engine/app/open1602

  coverage:
    name: Coverage (Linux GCC)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install dependencies
        # gcovr from PyPI at a fixed version: the report looks the same on every runner image.
        run: |
          sudo apt-get update && sudo apt-get install -y ninja-build zlib1g-dev
          pipx install gcovr==8.3

      - name: Configure
        run: cmake --preset coverage -DCMAKE_CXX_COMPILER=g++

      - name: Build
        run: cmake --build --preset coverage -- -k 0

      - name: Run the tests that need no original data
        run: build/coverage/tests/o1602_tests --no-data

      - name: Report
        # Lines and branches of the engine's sources (not tests, tools or third_party); the summary
        # goes to the job's page, the HTML report into the artifact.
        run: |
          set -o pipefail
          mkdir -p coverage
          gcovr --root . --object-directory build/coverage --filter 'engine/' \
                --exclude-throw-branches --exclude-unreachable-branches \
                --txt coverage/summary.txt --json-summary-pretty --json-summary coverage/summary.json \
                --html-details coverage/index.html --print-summary | tee coverage/totals.txt
          {
            echo '### Coverage of `o1602_tests --no-data` (engine/)'
            echo '```'
            cat coverage/totals.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: coverage
          path: coverage/
          if-no-files-found: error

  checks:
    name: Formatting
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install clang-format 18
        run: sudo apt-get update && sudo apt-get install -y clang-format-18
      - name: Check formatting
        # Called by its versioned name so that a runner image with another default version cannot
        # reformat the code (CONTRIBUTING.md names version 18).
        run: |
          clang-format-18 --version
          find engine tools tests \( -name '*.cpp' -o -name '*.hpp' \) -print0 | xargs -0 clang-format-18 --dry-run --Werror
