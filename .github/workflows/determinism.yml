# SPDX-License-Identifier: GPL-3.0-or-later
#
# Determinism across compilers and platforms (ADR 0004, ADR 0011): every computer of a multiplayer
# game must compute the same game. Each job of the matrix builds o1602-replay (only the simulation,
# no original data) and runs the same synthetic game with the same made-up commands for two game
# hours, printing the state hash every game minute; the "compare" job diffs the hash sequences of
# all platforms against Linux GCC and fails at the first difference. Each job also checks that a
# game saved and loaded every 7919 ticks goes on exactly as the one that ran through.
name: Determinism

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The same game everywhere: a synthetic world of 9 islands, 60 made-up commands a minute.
  REPLAY_ARGS: --synthetic --islands 3 --minutes 120 --random-commands 60 --command-seed 7

jobs:
  hashes:
    name: Hashes (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-gcc,     os: ubuntu-24.04, cxx: g++,     build_type: Release, flags: "" }
          - { name: linux-clang,   os: ubuntu-24.04, cxx: clang++, build_type: Release, flags: "" }
          - { name: linux-gcc-O0,  os: ubuntu-24.04, cxx: g++,     build_type: Debug,   flags: "" }
          - { name: linux-asan,    os: ubuntu-24.04, cxx: clang++, build_type: Debug,   flags: "-DO1602_SANITIZE=address;undefined" }
          # FMA contraction as on arm64: shows floating point that reaches the game's decisions.
          - { name: linux-gcc-fma, os: ubuntu-24.04, cxx: g++,     build_type: Release, flags: "-DCMAKE_CXX_FLAGS=-march=x86-64-v3 -ffp-contract=fast" }
          - { name: windows-msvc,  os: windows-2025, cxx: cl,      build_type: Release, flags: "" }
          - { name: macos-arm64,   os: macos-14,     cxx: clang++, build_type: Release, flags: "" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Set up MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756  # v1.13.0
        with:
          arch: x64

      # zlib is not needed: the state hash is taken over the unpacked sections.
      - name: Configure
        shell: bash
        run: |
          args=(-S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
                -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} -DO1602_BUILD_TESTS=OFF -DO1602_WARNINGS_AS_ERRORS=ON)
          if [ -n "${{ matrix.flags }}" ]; then args+=("${{ matrix.flags }}"); fi
          cmake "${args[@]}"

      - name: Build
        run: cmake --build build --target o1602-replay

      - name: Hashes
        shell: bash
        run: |
          mkdir -p hashes
          build/tools/o1602-replay/o1602-replay $REPLAY_ARGS > hashes/${{ matrix.name }}.txt 2> hashes/${{ matrix.name }}.err
          tail -3 hashes/${{ matrix.name }}.err

      - name: Saved and loaded in between, the game goes on the same
        shell: bash
        run: build/tools/o1602-replay/o1602-replay $REPLAY_ARGS --check-roundtrip 7919 --every 600 > /dev/null

      - name: Upload the hashes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: hashes-${{ matrix.name }}
          path: hashes/
          if-no-files-found: error

  compare:
    name: Compare the hashes of all platforms
    needs: hashes
    # Also when a platform failed: the hashes of the others still show where they part.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      # Pin to the commit SHA of the release like the other actions (Dependabot keeps it current).
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16  # v4.1.8
        with:
          pattern: hashes-*
          merge-multiple: true
          path: hashes

      - name: Diff against Linux GCC
        shell: bash
        run: |
          status=0
          for f in hashes/*.txt; do
            if ! diff -q hashes/linux-gcc.txt "$f" > /dev/null; then
              echo "::error::$(basename "$f" .txt) computes another game than linux-gcc"
              diff hashes/linux-gcc.txt "$f" | head -5
              status=1
            fi
          done
          {
            echo '### State hashes after two game hours'
            echo '```'
            for f in hashes/*.txt; do printf '%-16s %s\n' "$(basename "$f" .txt)" "$(tail -1 "$f")"; done
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status
