# SPDX-License-Identifier: GPL-3.0-or-later
#
# Proposal: the libFuzzer targets of tests/fuzz with ASan and UBSan, about 60 s each (11 targets,
# two at a time: about 6 minutes of fuzzing). The corpus is kept in the Actions cache between runs,
# so coverage grows over time; a finding fails the job and its input is uploaded as an artifact.
# The original game data never reaches CI: the seeds are synthetic (o1602_fuzz_seeds).
name: Fuzz

on:
  push:
    branches: [main]
  pull_request:
    paths: ['engine/core/**', 'engine/assets/**', 'engine/sim/src/save/**', 'engine/sim/src/save_game.cpp',
            'engine/sim/src/savegame*.cpp', 'engine/sim/src/validate.cpp', 'engine/sim/src/world.cpp',
            'engine/sim/src/island_map.cpp', 'engine/sim/src/command_io.cpp', 'engine/net/**',
            'engine/audio/src/wav.cpp', 'engine/video/**', 'engine/app/src/*settings*', 'tests/fuzz/**',
            'tools/fuzz/**', 'cmake/Fuzzing.cmake', '.github/workflows/fuzz.yml']
  schedule:
    - cron: '17 3 * * *'  # nightly: 10 minutes per target
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: libFuzzer (ASan, UBSan)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build zlib1g-dev clang-18

      - name: Restore corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: fuzz-work/corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-

      - name: Configure
        run: >
          cmake -S . -B build/fuzz -G Ninja -DCMAKE_C_COMPILER=clang-18 -DCMAKE_CXX_COMPILER=clang++-18
          -DCMAKE_BUILD_TYPE=RelWithDebInfo "-DCMAKE_CXX_FLAGS_RELWITHDEBINFO=-O1 -g"
          -DCMAKE_CXX_FLAGS=-D_GLIBCXX_ASSERTIONS "-DO1602_SANITIZE=address;undefined" -DO1602_FUZZ=ON
          -DO1602_BUILD_TESTS=OFF -DO1602_BUILD_TOOLS=OFF

      - name: Build
        run: cmake --build build/fuzz

      - name: Fuzz
        env:
          FUZZ_JOBS: 2
        run: >
          tools/fuzz/run_fuzzers.sh build/fuzz ${{ github.event_name == 'schedule' && 600 || 60 }} fuzz-work

      - name: Upload findings
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: fuzz-findings
          path: |
            fuzz-work/artifacts
            fuzz-work/*.log

      - name: Save corpus
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: fuzz-work/corpus
          key: fuzz-corpus-${{ github.run_id }}
