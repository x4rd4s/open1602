# Buildings of this package (own-buildings.md).

# A pepper farm: the tobacco plantation's values, making pepper from nothing (no fields), worked by
# the pepper pickers. A picture of its own: with the plantation's sprites the map would show, and the
# game read, a tobacco plantation.
[pepper_farm]
like = "anno1602:tobacco_plantation"
gfx = "example:pepper_farm"
ware = "example:pepper"
raw = ""
figure = "example:pepper_picker"

# A lighthouse: the watchtower's values, drawn with this package's image, with a horn when built.
[lighthouse]
like = "anno1602:watchtower"
gfx = "example:lighthouse"
build_sound = "example:horn"
level = "example:harbour"

# A court: the chapel's values and a public service of its own kind, which the merchants need and
# the computers build (slots.toml).
[court]
like = "anno1602:chapel"
gfx = "example:court"
service = true
