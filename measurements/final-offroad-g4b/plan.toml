# Metrics, per run from the AI log (O1602_AI_LOG=1) of a build with the gate's logging patch (both
# arms the same, it only logs). A count is 0 in a run without its event; a mean over no events is
# "n/a" and the verdict leaves that run out of it and counts it.
# food_balance_gap60: the food balance in t/min of each hungry home city an hour after its shortfall
#   began, summed over those cities;
# gap_cities: how many home cities open a food shortfall (reported, does not decide: a bundle that
#   prevents shortfalls loses negative terms of the sum above, which should be visible);
# low_gold_foundings: the colonies founded with less than 3,000 gold in hand (the definition of every
#   earlier run);
# foundings: the colonies founded;
# colony_net_60: a colony's net gold (taxes + sales - running costs - purchases) over the 60 minutes
#   after its founding, the mean over the run's colonies ("n/a" without one).
# The inhabitants (not worse) and the collapse rate per player and run (not worse) are judged per
# set by the verdict itself.
[[metric]]
name = "food_balance_gap60"
better = "higher"
[[metric]]
name = "gap_cities"
better = "lower"
decides = false
[[metric]]
name = "low_gold_foundings"
better = "lower"
[[metric]]
name = "foundings"
better = "higher"
[[metric]]
name = "colony_net_60"
better = "higher"

