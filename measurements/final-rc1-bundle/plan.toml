# Metrics, per run from the AI log (O1602_AI_LOG=1) of a build with the gate's logging patch (both
# arms the same, it only logs).
# unreachable_farms: the farms a computer placed whose first sample has no market or Kontor whose carts
#   reach it by road;
# food_balance_gap60: as in the offroad gate, reported only.
# The inhabitants (not worse) and the collapse rate per player and run (not worse) are judged per
# set by the verdict itself.
[[metric]]
name = "unreachable_farms"
better = "lower"
[[metric]]
name = "food_balance_gap60"
better = "higher"
decides = false

